[package]
name = "drmanhattan"
version = "0.1.1"
edition = "2021"
rust-version = "1.87"
description = "watchmaker (wmk): disassemble directories into storage units and rebuild them exactly"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AtlantisAnalytics/drmanhattan"
readme = "../../README.md"
keywords = ["cli", "deduplication", "dataset", "snapshot", "reproducibility"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "wmk"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
drmanhattan-core = { version = "0.1.1", path = "../core" }
humantime = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
rusqlite = { version = "0.41", features = ["bundled"] }
tempfile = "3.27.0"
