[package]
name = "drmanhattan"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wmk"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
drmanhattan-core = { version = "0.1.0", path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
rusqlite = { version = "0.41", features = ["bundled"] }
tempfile = "3.27.0"
