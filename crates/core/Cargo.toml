[package]
name = "drmanhattan-core"
version = "0.1.0"
edition = "2021"

[features]
failpoints = []

[dependencies]
blake3 = "1.8.7"
fs4 = { version = "1.1.0", features = ["sync"] }
hex = "0.4.3"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"
uuid = { version = "1.29.0", features = ["v7"] }

[dev-dependencies]
tempfile = "3.27.0"
