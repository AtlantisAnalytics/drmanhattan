[package]
name = "drmanhattan-core"
version = "0.1.0"
edition = "2021"

[features]
failpoints = []
test-seams = []

[dependencies]
blake3 = "1.8.7"
crc32c = "0.6.8"
fastcdc = "5.0.0"
filetime = "0.2.29"
fs4 = { version = "1.1.0", features = ["sync"] }
hex = "0.4.3"
infer = "0.22.0"
libc = "0.2.191"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"
uuid = { version = "1.29.0", features = ["v7"] }
xattr = "1.6.1"
zstd = "0.14.3"

[dev-dependencies]
# Self dev-dependency: enables the test-seams feature for plain `cargo test`.
drmanhattan-core = { path = ".", features = ["test-seams"] }
rand_chacha = "0.10.0"
rand_core = "0.10.1"
serde_json = "1.0.154"
tempfile = "3.27.0"
