[package]
name = "drmanhattan-core"
version = "0.1.0"
edition = "2021"

[features]
failpoints = []

[dependencies]
blake3 = "1.8.7"
crc32c = "0.6.8"
fastcdc = "5.0.0"
fs4 = { version = "1.1.0", features = ["sync"] }
hex = "0.4.3"
infer = "0.22.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"
uuid = { version = "1.29.0", features = ["v7"] }
zstd = "0.14.3"

[dev-dependencies]
rand_chacha = "0.10.0"
rand_core = "0.10.1"
serde_json = "1.0.154"
tempfile = "3.27.0"
